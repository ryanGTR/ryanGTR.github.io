title: Ryan 的交付鏈筆記
description: OpenShift／Tekton／Harbor／供應鏈安全——在自己的筆電上把企業交付鏈拆開來看。
author: Ryan Chen
lang: zh-Hant
url: https://ryanGTR.github.io
theme: minima
minima:
  date_format: "%Y-%m-%d"
  social_links:
    github: ryanGTR
header_pages:
  - about.md
show_excerpts: true
permalink: /:year/:month/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - scripts
  - ithome
future: true
timezone: Asia/Taipei

# 留言：giscus（GitHub Discussions）
# 目的＝拿到讀者的真實回饋，不是衝互動數。每篇 front matter 可加 feedback_question，
# 會顯示在留言框上方——問一個對方一看就知道自己有答案的具體問題。
giscus:
  repo: "ryanGTR/ryanGTR.github.io"
  repo_id: "R_kgDOT_bAIg"
  category: "Announcements"
  category_id: "DIC_kwDOT_bAIs4DEax1"
  heading: "留言與指正"
